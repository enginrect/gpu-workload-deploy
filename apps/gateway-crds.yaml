# wave 0 — Gateway API v1.6.1 standard(CRD 10 + safe-upgrades VAP) + Envoy Gateway CRD 8종. 원본 20-gateway-api-crds.yaml(kubectl SSA)을 gateway-crds-helm v1.9.2로 대체(렌더 내용 동일)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gateway-crds
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    argocd.argoproj.io/compare-options: ServerSideDiff=true
spec:
  project: neocloud-platform
  destination:
    name: tech-neo-wkld
    namespace: envoy-gateway-system
  sources:
  - repoURL: docker.io/envoyproxy
    chart: gateway-crds-helm
    targetRevision: v1.9.2
    helm:
      valueFiles:
      - $values/platform/values/gateway-crds.yaml
  - repoURL: https://github.com/enginrect/gpu-workload-deploy.git
    targetRevision: main
    ref: values
  syncPolicy:
    # 2026-10-20 채택 완료(전 Application zero-diff · 재시작 0 확인) 뒤 수동 → automated. prune은 계속 false(리포에서 지운 리소스는 손으로 정리).
    automated:
      selfHeal: true
      prune: false
    syncOptions:
    - ServerSideApply=true
    - RespectIgnoreDifferences=true
    retry:
      limit: 5
      backoff: {duration: 10s, factor: 2, maxDuration: 3m}
