# wave 6 — ExternalDNS chart 1.23.0(0.23.0) helm 채택(release external-dns). provider inmemory(Route53 가정 · 미연결) — 전환 값은 README
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-dns
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "6"
    argocd.argoproj.io/compare-options: ServerSideDiff=true
spec:
  project: neocloud-platform
  destination:
    name: tech-neo-wkld
    namespace: external-dns
  sources:
  - repoURL: https://kubernetes-sigs.github.io/external-dns/
    chart: external-dns
    targetRevision: 1.23.0
    helm:
      releaseName: external-dns
      skipCrds: true
      valueFiles:
      - $values/platform/values/23-external-dns-values.yaml
  - repoURL: https://github.com/enginrect/gpu-workload-deploy.git
    targetRevision: main
    ref: values
  syncPolicy:
    # 채택 단계: automated 없음 — 수동 sync + diff 검토. 전 Application zero-diff 확인 뒤 automated {selfHeal: true, prune: false}로 올린다.
    syncOptions:
    - ServerSideApply=true
    - CreateNamespace=true
    - RespectIgnoreDifferences=true
    retry:
      limit: 5
      backoff: {duration: 10s, factor: 2, maxDuration: 3m}
