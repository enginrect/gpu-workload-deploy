# wave 1 — ns neocloud-system · SA telox-* · ClusterRole/Binding(01-system-rbac), Kyverno aggregated ClusterRole(10-kyverno-rbac), dcgm-exporter DRA 읽기(30-dcgm-exporter-dra-rbac)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: system-rbac
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/compare-options: ServerSideDiff=true
spec:
  project: neocloud-platform
  destination:
    name: tech-neo-wkld
  source:
    repoURL: https://github.com/enginrect/gpu-workload-deploy.git
    targetRevision: main
    path: platform/system-rbac
  syncPolicy:
    # 채택 단계: automated 없음 — 수동 sync + diff 검토. 전 Application zero-diff 확인 뒤 automated {selfHeal: true, prune: false}로 올린다.
    syncOptions:
    - ServerSideApply=true
    - RespectIgnoreDifferences=true
    retry:
      limit: 5
      backoff: {duration: 10s, factor: 2, maxDuration: 3m}
