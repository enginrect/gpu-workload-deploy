# wave 0 — neocloud.io CRD 4종(Domain · SKU · Instance = 00-crds.yaml, ServerlessInstance = 02-serverlessinstance-crd.yaml)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: neocloud-crds
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    argocd.argoproj.io/compare-options: ServerSideDiff=true
spec:
  project: neocloud-platform
  destination:
    name: tech-neo-wkld
  source:
    repoURL: https://github.com/enginrect/gpu-workload-deploy.git
    targetRevision: main
    path: platform/neocloud-crds
  syncPolicy:
    # 채택 단계: automated 없음 — 수동 sync + diff 검토. 전 Application zero-diff 확인 뒤 automated {selfHeal: true, prune: false}로 올린다.
    syncOptions:
    - ServerSideApply=true
    - RespectIgnoreDifferences=true
    retry:
      limit: 5
      backoff: {duration: 10s, factor: 2, maxDuration: 3m}
