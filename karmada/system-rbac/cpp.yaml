# ns telox-system · SA 3종 · ClusterRole/ClusterRoleBinding(telox:*) · Kyverno aggregated ClusterRole을 모든 wkld 멤버에 전파.
# Overwrite — 직접 배포 경로에서 옮길 때 기존 오브젝트 채택.
apiVersion: policy.karmada.io/v1alpha1
kind: ClusterPropagationPolicy
metadata: {name: telox-system-rbac}
spec:
  conflictResolution: Overwrite
  preserveResourcesOnDeletion: true   # 직접 경로 이행 — template을 지워도 멤버 오브젝트는 남김(Argo 직접 경로가 채택)
  resourceSelectors:
  - {apiVersion: v1, kind: Namespace, name: telox-system}
  - {apiVersion: v1, kind: ServiceAccount, namespace: telox-system}
  - {apiVersion: rbac.authorization.k8s.io/v1, kind: ClusterRole, name: "telox:domain-member"}
  - {apiVersion: rbac.authorization.k8s.io/v1, kind: ClusterRole, name: "telox:telox-gateway"}
  - {apiVersion: rbac.authorization.k8s.io/v1, kind: ClusterRole, name: "telox:ops-backend"}
  - {apiVersion: rbac.authorization.k8s.io/v1, kind: ClusterRole, name: "telox:telox-worker"}
  - {apiVersion: rbac.authorization.k8s.io/v1, kind: ClusterRole, name: "kyverno:telox-read"}
  - {apiVersion: rbac.authorization.k8s.io/v1, kind: ClusterRoleBinding, name: "telox:telox-gateway"}
  - {apiVersion: rbac.authorization.k8s.io/v1, kind: ClusterRoleBinding, name: "telox:ops-backend"}
  - {apiVersion: rbac.authorization.k8s.io/v1, kind: ClusterRoleBinding, name: "telox:telox-worker"}
  placement:
    clusterAffinity:
      labelSelector: {matchLabels: {telox.io/role: wkld}}
