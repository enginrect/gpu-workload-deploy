# Identity §4·§5 — telox-worker SA(wkld), telox-manager 운영 identity group ops:backend, 고객 group의 ClusterRole(RoleBinding은 Domain reconcile이 namespace마다)
apiVersion: v1
kind: Namespace
metadata:
  name: telox-system
  labels:
    telox.io/role: gateway   # ServerlessInstance worker의 NetworkPolicy가 이 label의 namespace에서만 ingress 허용(telox-gateway 위치)
    namespace.karmada.io/skip-auto-propagation: "true"   # karmada-apiserver의 namespace 자동 전파(모든 멤버) 대신 cpp.yaml의 선택으로만 전파
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: telox-worker, namespace: telox-system}
---
# 1단계 백엔드 kubeconfig identity — telox-manager(mgmt)가 이 SA 토큰으로 wkld apiserver에 접근. admin kubeconfig 아님.
# 권한 = ClusterRole telox:ops-backend(Domain · SKU · 재고 읽기) + domain namespace마다 RoleBinding telox-domain-member(Instance · Secret, Domain reconcile이 바인딩)
apiVersion: v1
kind: ServiceAccount
metadata: {name: telox-manager, namespace: telox-system}
---
# 고객 group domain-<id>:member에 주는 권한 — 내용은 GitOps, 바인딩은 Domain reconcile(RoleBinding, namespace 단위)
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: {name: "telox:domain-member"}
rules:
- apiGroups: [telox.io]
  resources: [instances, serverlessinstances]        # serverlessinstances/scale 없음 — worker 수는 gateway만
  verbs: [get, list, watch, create, update, patch, delete]
- apiGroups: [""]
  resources: [secrets]
  verbs: [get, list, watch, create, update, patch, delete]
---
# serverless gateway — 요청 라우팅 · autoscaler. ServerlessInstance는 읽기 + scale 서브리소스만, Pod · Service · EndpointSlice 읽기
apiVersion: v1
kind: ServiceAccount
metadata: {name: telox-gateway, namespace: telox-system}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: {name: "telox:telox-gateway"}
rules:
- apiGroups: [telox.io]
  resources: [serverlessinstances]
  verbs: [get, list, watch]
- apiGroups: [telox.io]
  resources: [serverlessinstances/scale]
  verbs: [get, update, patch]
- apiGroups: [""]
  resources: [services, pods]
  verbs: [get, list, watch]
- apiGroups: [discovery.k8s.io]
  resources: [endpointslices]
  verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: "telox:telox-gateway"}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: "telox:telox-gateway"}
subjects:
- {kind: ServiceAccount, name: telox-gateway, namespace: telox-system}
---
# 운영 identity — 클러스터 범위 쓰기는 Domain · SKU 오브젝트뿐. Namespace 쓰기 없음(Domain reconcile 몫). Instance · Secret은 1단계에 한해 domain namespace RoleBinding으로(위 SA 주석)
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: {name: "telox:ops-backend"}
rules:
- apiGroups: [telox.io]
  resources: [domains]
  verbs: [create, update, patch, delete, get, list, watch]
- apiGroups: [telox.io]
  resources: [skus]
  verbs: [create, delete, get, list, watch]
- apiGroups: [""]
  resources: [nodes]
  verbs: [get, list, watch]
- apiGroups: [resource.k8s.io]
  resources: [resourceslices, resourceclaims, deviceclasses]
  verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: "telox:ops-backend"}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: "telox:ops-backend"}
subjects:
- {kind: Group, name: "ops:backend", apiGroup: rbac.authorization.k8s.io}          # Keycloak client credentials(Identity §1)
- {kind: ServiceAccount, name: telox-manager, namespace: telox-system}   # 1단계 kubeconfig
---
# worker SA — Instance reconcile(domain namespace의 Pod · ResourceClaim · PVC · Service · NetworkPolicy · PDB) + ServerlessInstance reconcile(worker Pod · ResourceClaim · ClusterIP Service · NetworkPolicy) + Domain reconcile(Namespace · RoleBinding · ResourceQuota · default-deny · LB pool). 삭제는 GC(ownerReference)
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: {name: "telox:telox-worker"}
rules:
- apiGroups: [""]
  resources: [pods, persistentvolumeclaims, services]
  verbs: [get, list, watch, create, update, patch, delete]
- apiGroups: [resource.k8s.io]
  resources: [resourceclaims]
  verbs: [get, list, watch, create, update, patch, delete]
- apiGroups: [resource.k8s.io]
  resources: [resourceslices, deviceclasses]
  verbs: [get, list, watch]
- apiGroups: [networking.k8s.io]
  resources: [networkpolicies]
  verbs: [get, list, watch, create, update, patch, delete]
- apiGroups: [policy]
  resources: [poddisruptionbudgets]
  verbs: [get, list, watch, create, update, patch, delete]
- apiGroups: [telox.io]
  resources: [instances, serverlessinstances, skus, domains]
  verbs: [get, list, watch]
- apiGroups: [telox.io]
  resources: [instances/status, serverlessinstances/status, domains/status]
  verbs: [get, update, patch]
- apiGroups: [""]
  resources: [nodes]
  verbs: [get, list, watch]
# --- Domain reconcile
- apiGroups: [""]
  resources: [namespaces]
  verbs: [get, list, watch, create, update, patch]
- apiGroups: [""]
  resources: [resourcequotas]
  verbs: [get, list, watch, create, update, patch]
- apiGroups: [rbac.authorization.k8s.io]
  resources: [rolebindings]
  verbs: [get, list, watch, create, update, patch]
- apiGroups: [rbac.authorization.k8s.io]
  resources: [clusterroles]
  resourceNames: ["telox:domain-member"]
  verbs: [bind]
- apiGroups: [cilium.io]
  resources: [ciliumloadbalancerippools]
  verbs: [get, list, watch, create, update, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: "telox:telox-worker"}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: "telox:telox-worker"}
subjects:
- {kind: ServiceAccount, name: telox-worker, namespace: telox-system}
