# Domain d → region-2 클러스터 하나(tech-neo-wkld-region2)에만. domain은 클러스터 하나에만 — 다른 멤버(region-1)에 흔적이 없어야 함
apiVersion: v1
kind: Namespace
metadata:
  name: domain-d
  labels:
    telox.io/domain: d
    pod-security.kubernetes.io/enforce: baseline
    namespace.karmada.io/skip-auto-propagation: "true"
---
apiVersion: telox.io/v1alpha1
kind: Domain
metadata: {name: d}
spec:
  allowedSkus: [cpu-2-4g]
  maxGpus: {cpu: 0}
  maxStorage: 100Gi
  maxInstances: 4
  lbPool: {cidrs: [10.7.56.112/29]}   # region-2 LB 대역(10.7.56.96/27) 안. default-pool은 /28로 좁힘
---
apiVersion: policy.karmada.io/v1alpha1
kind: ClusterPropagationPolicy
metadata: {name: domain-d}
spec:
  resourceSelectors:
  - {apiVersion: v1, kind: Namespace, name: domain-d}
  - {apiVersion: telox.io/v1alpha1, kind: Domain, name: d}
  placement: {clusterAffinity: {clusterNames: [tech-neo-wkld-region2]}}
