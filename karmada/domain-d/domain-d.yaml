# Domain d → tech-neo-wkld-region2. domain은 계약 전체, 여러 클러스터에 걸치면 clusterNames에 나열하고 클러스터별 차이(제공 SKU · GPU 상한 · LB 대역)는 ClusterOverridePolicy(targetCluster labelSelector telox.io/region, kind마다 COP 분리 — §3.16 함정)로. 고객은 클러스터를 모르고 리전만 봄.
apiVersion: v1
kind: Namespace
metadata:
  name: domain-d
  labels:
    telox.io/domain: d
    pod-security.kubernetes.io/enforce: baseline
    namespace.karmada.io/skip-auto-propagation: "true"
---
apiVersion: telox.io/v1alpha1
kind: Domain
metadata: {name: d}
spec:
  allowedSkus: [cpu-2-4g]            # region-2 제공 SKU
  maxGpus: {gpu: 0}                  # region-2는 GPU 없음
  maxStorage: 100Gi
  maxInstances: 4
  lbPool: {cidrs: [10.7.56.112/29]}   # region-2 LB 대역(10.7.56.96/27) 안
---
# domain LB 대역
apiVersion: cilium.io/v2
kind: CiliumLoadBalancerIPPool
metadata: {name: domain-d, labels: {telox.io/domain: d}}
spec:
  blocks: [{cidr: 10.7.56.112/29}]
  serviceSelector: {matchLabels: {telox.io/domain: d}}
---
apiVersion: policy.karmada.io/v1alpha1
kind: ClusterPropagationPolicy
metadata: {name: domain-d}
spec:
  conflictResolution: Overwrite
  resourceSelectors:
  - {apiVersion: v1, kind: Namespace, name: domain-d}
  - {apiVersion: telox.io/v1alpha1, kind: Domain, name: d}
  - {apiVersion: cilium.io/v2, kind: CiliumLoadBalancerIPPool, name: domain-d}
  placement: {clusterAffinity: {clusterNames: [tech-neo-wkld-region2]}}
