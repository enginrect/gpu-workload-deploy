# project별 Gateway(project dev) — region-2. Cilium L2 + externalTrafficPolicy Local은 lease node ≠ Envoy node면 connection refused(재현) → edge node(label telox.io/edge) 하나에 Envoy pod와 L2 announce(policy nodeSelector)를 같이 고정. 운영은 BGP + edge pool. TLS Secret wildcard-r2(*.r2.neo.test)는 멤버 domain-d에 직접 생성
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata: {name: ep-dev, namespace: domain-d, labels: {telox.io/domain: d, telox.io/project: dev}}
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyDeployment:
        replicas: 1
        pod:
          nodeSelector: {telox.io/edge: "true"}
      envoyService:
        type: LoadBalancer
        externalTrafficPolicy: Local
        annotations: {lbipam.cilium.io/ips: "10.7.56.112"}
        labels: {telox.io/domain: d, telox.io/project: dev}
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: gw-dev
  namespace: domain-d
  labels: {telox.io/domain: d, telox.io/project: dev, tktech.thakicloud.io/dns-source: "true"}
spec:
  gatewayClassName: telox
  infrastructure:
    parametersRef: {group: gateway.envoyproxy.io, kind: EnvoyProxy, name: ep-dev}
  allowedListeners:
    namespaces: {from: Same}
  listeners:
  - name: http
    protocol: HTTP
    port: 80
    hostname: "*.r2.neo.test"
    allowedRoutes: {namespaces: {from: Same}}
  - name: https
    protocol: HTTPS
    port: 443
    hostname: "*.r2.neo.test"
    tls: {mode: Terminate, certificateRefs: [{group: "", kind: Secret, name: wildcard-r2}]}
    allowedRoutes: {namespaces: {from: Same}}
---
apiVersion: policy.karmada.io/v1alpha1
kind: PropagationPolicy
metadata: {name: gateway-dev, namespace: domain-d}
spec:
  resourceSelectors:
  - {apiVersion: gateway.envoyproxy.io/v1alpha1, kind: EnvoyProxy, name: ep-dev, namespace: domain-d}
  - {apiVersion: gateway.networking.k8s.io/v1, kind: Gateway, name: gw-dev, namespace: domain-d}
  placement: {clusterAffinity: {clusterNames: [tech-neo-wkld-region2]}}
