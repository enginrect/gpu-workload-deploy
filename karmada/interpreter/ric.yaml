apiVersion: config.karmada.io/v1alpha1
kind: ResourceInterpreterCustomization
metadata:
  name: telox-domain
spec:
  target:
    apiVersion: telox.io/v1alpha1
    kind: Domain
  customizations:
    statusAggregation:
      luaScript: |
        function AggregateStatus(desiredObj, statusItems)
          if statusItems == nil then return desiredObj end
          for i = 1, #statusItems do
            if statusItems[i].status ~= nil then desiredObj.status = statusItems[i].status end
          end
          return desiredObj
        end
    healthInterpretation:
      luaScript: |
        function InterpretHealth(observedObj)
          if observedObj.status == nil or observedObj.status.conditions == nil then return false end
          for i = 1, #observedObj.status.conditions do
            local c = observedObj.status.conditions[i]
            if c.type == 'Ready' and c.status == 'True' then return true end
          end
          return false
        end
---
apiVersion: config.karmada.io/v1alpha1
kind: ResourceInterpreterCustomization
metadata:
  name: telox-instance
spec:
  target:
    apiVersion: telox.io/v1alpha1
    kind: Instance
  customizations:
    statusAggregation:
      luaScript: |
        function AggregateStatus(desiredObj, statusItems)
          if statusItems == nil then return desiredObj end
          for i = 1, #statusItems do
            if statusItems[i].status ~= nil then desiredObj.status = statusItems[i].status end
          end
          return desiredObj
        end
    healthInterpretation:
      luaScript: |
        function InterpretHealth(observedObj)
          return observedObj.status ~= nil and observedObj.status.phase == 'Running'
        end
    replicaResource:
      luaScript: |
        function GetReplicas(obj)
          -- domain 전체 GPU 쿼터(FederatedResourceQuota)용: Instance 1개 = replica 1, GPU 수는 telox-manager가 기록한 annotation telox.io/gpu-count
          local gpu = "0"
          if obj.metadata.annotations ~= nil and obj.metadata.annotations["telox.io/gpu-count"] ~= nil then
            gpu = obj.metadata.annotations["telox.io/gpu-count"]
          end
          local requirement = {}
          requirement.resourceRequest = {}
          requirement.resourceRequest["telox.io/gpu"] = gpu
          return 1, requirement
        end
---
