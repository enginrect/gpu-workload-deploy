---
apiVersion: config.karmada.io/v1alpha1
kind: ResourceInterpreterCustomization
metadata:
  name: telox-httproute
spec:
  target:
    apiVersion: gateway.networking.k8s.io/v1
    kind: HTTPRoute
  customizations:
    statusAggregation:
      luaScript: |
        function AggregateStatus(desiredObj, statusItems)
          if statusItems == nil then return desiredObj end
          for i = 1, #statusItems do
            if statusItems[i].status ~= nil then desiredObj.status = statusItems[i].status end
          end
          return desiredObj
        end
    healthInterpretation:
      luaScript: |
        function InterpretHealth(observedObj)
          if observedObj.status == nil or observedObj.status.parents == nil or #observedObj.status.parents == 0 then return false end
          for i = 1, #observedObj.status.parents do
            local p = observedObj.status.parents[i]
            if p.conditions == nil then return false end
            for j = 1, #p.conditions do
              local c = p.conditions[j]
              if (c.type == 'Accepted' or c.type == 'ResolvedRefs') and c.status ~= 'True' then return false end
            end
          end
          return true
        end
---
