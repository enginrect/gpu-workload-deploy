---
apiVersion: config.karmada.io/v1alpha1
kind: ResourceInterpreterCustomization
metadata:
  name: telox-kyverno-clusterpolicy
spec:
  target:
    apiVersion: kyverno.io/v1
    kind: ClusterPolicy
  customizations:
    statusAggregation:
      luaScript: |
        function AggregateStatus(desiredObj, statusItems)
          if statusItems == nil then return desiredObj end
          local ready, reported, conditions = true, 0, {}
          for i = 1, #statusItems do
            local s = statusItems[i].status
            -- Kyverno 1.17: status.ready 없음, conditions[type=Ready] 로 판단(ready 필드는 옛 버전)
            local r = nil
            if s ~= nil then
              if s.ready ~= nil then r = (s.ready == true) end
              if s.conditions ~= nil then
                for j = 1, #s.conditions do
                  local c = s.conditions[j]
                  if c.type == 'Ready' then r = (c.status == 'True') end
                end
              end
            end
            if r ~= nil then
              reported = reported + 1
              if r ~= true then ready = false end
              if s.conditions ~= nil then
                for j = 1, #s.conditions do
                  local c = s.conditions[j]
                  c.message = statusItems[i].clusterName .. '=' .. (c.message or '')
                  conditions[#conditions + 1] = c
                end
              end
            else
              ready = false
            end
          end
          if reported == 0 then return desiredObj end
          desiredObj.status = {ready = ready}
          if #conditions > 0 then desiredObj.status.conditions = conditions end
          return desiredObj
        end
    healthInterpretation:
      luaScript: |
        function InterpretHealth(observedObj)
          if observedObj.status == nil then return false end
          if observedObj.status.ready ~= nil then return observedObj.status.ready == true end
          if observedObj.status.conditions ~= nil then
            for i = 1, #observedObj.status.conditions do
              local c = observedObj.status.conditions[i]
              if c.type == 'Ready' then return c.status == 'True' end
            end
          end
          return false
        end
---
apiVersion: config.karmada.io/v1alpha1
kind: ResourceInterpreterCustomization
metadata:
  name: telox-kyverno-validatingpolicy
spec:
  target:
    apiVersion: policies.kyverno.io/v1
    kind: ValidatingPolicy
  customizations:
    statusAggregation:
      luaScript: |
        function AggregateStatus(desiredObj, statusItems)
          if statusItems == nil then return desiredObj end
          local ready, reported, conditions = true, 0, {}
          for i = 1, #statusItems do
            local s = statusItems[i].status
            if s ~= nil and s.conditionStatus ~= nil and s.conditionStatus.ready ~= nil then
              reported = reported + 1
              if s.conditionStatus.ready ~= true then ready = false end
              if s.conditionStatus.conditions ~= nil then
                for j = 1, #s.conditionStatus.conditions do
                  local c = s.conditionStatus.conditions[j]
                  c.message = statusItems[i].clusterName .. '=' .. (c.message or '')
                  conditions[#conditions + 1] = c
                end
              end
            else
              ready = false
            end
          end
          if reported == 0 then return desiredObj end
          desiredObj.status = {conditionStatus = {ready = ready}}
          if #conditions > 0 then desiredObj.status.conditionStatus.conditions = conditions end
          return desiredObj
        end
    healthInterpretation:
      luaScript: |
        function InterpretHealth(observedObj)
          return observedObj.status ~= nil and observedObj.status.conditionStatus ~= nil and observedObj.status.conditionStatus.ready == true
        end
---
apiVersion: config.karmada.io/v1alpha1
