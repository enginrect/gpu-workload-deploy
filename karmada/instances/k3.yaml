# k3 — HTTP 노출 확인용 Instance(nginx unprivileged 8080). Service + NetworkPolicy + HTTPRoute(호스트명 패턴 ② <name>-<port>-<project>-<domain>.r1.neo.test)
apiVersion: telox.io/v1alpha1
kind: Instance
metadata: {name: k3, namespace: domain-c, labels: {telox.io/project: dev}}
spec:
  sku: cpu-4-8g
  image: docker.io/nginxinc/nginx-unprivileged:1.27-alpine
  ports: [{name: http, port: 8080, protocol: TCP}]
---
apiVersion: v1
kind: Service
metadata: {name: k3, namespace: domain-c, labels: {telox.io/instance: k3, telox.io/project: dev}}
spec:
  type: ClusterIP
  selector: {telox.io/instance: k3}
  ports: [{name: http, port: 8080, targetPort: 8080, protocol: TCP}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: k3-gateway-ingress, namespace: domain-c, labels: {telox.io/instance: k3}}
spec:
  podSelector: {matchLabels: {telox.io/instance: k3}}
  policyTypes: [Ingress]
  ingress:
  - from:
    - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: envoy-gateway-system}}
      podSelector: {matchLabels: {gateway.envoyproxy.io/owning-gateway-name: gw-c, gateway.envoyproxy.io/owning-gateway-namespace: domain-c}}
    ports: [{protocol: TCP, port: 8080}]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: {name: k3-8080, namespace: domain-c, labels: {telox.io/instance: k3}}
spec:
  parentRefs:
  - {group: gateway.networking.k8s.io, kind: Gateway, name: gw-c, sectionName: https}
  - {group: gateway.networking.k8s.io, kind: Gateway, name: gw-c, sectionName: http}
  hostnames: [k3-8080-dev-c.r1.neo.test]
  rules:
  - matches: [{path: {type: PathPrefix, value: /}}]
    backendRefs: [{group: "", kind: Service, name: k3, port: 8080, weight: 1}]
