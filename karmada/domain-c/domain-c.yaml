# Domain c → 클러스터 하나(tech-neo-wkld). domain은 여러 클러스터(리전)에 걸칠 수 있음(domain-d/domain-d.yaml 참조) — 어느 클러스터들인지는 telox-manager가 onboarding 때 정해 clusterNames로 기록(region은 Cluster spec.region · label telox.io/region으로 선택 입력). 고객은 클러스터를 모르고 리전만 봄.
# namespace는 skip label이 없으면 모든 멤버에 자동 생성되므로 label 필수.
apiVersion: v1
kind: Namespace
metadata:
  name: domain-c
  labels:
    telox.io/domain: c
    pod-security.kubernetes.io/enforce: baseline
    namespace.karmada.io/skip-auto-propagation: "true"
---
apiVersion: telox.io/v1alpha1
kind: Domain
metadata: {name: c}
spec:
  allowedSkus: [cpu-4-8g]
  maxGpus: {gpu: 0}
  maxStorage: 100Gi
  maxInstances: 4
  lbPool: {cidrs: [10.7.56.88/29]}
---
apiVersion: policy.karmada.io/v1alpha1
kind: ClusterPropagationPolicy
metadata: {name: domain-c}
spec:
  resourceSelectors:
  - {apiVersion: v1, kind: Namespace, name: domain-c}
  - {apiVersion: telox.io/v1alpha1, kind: Domain, name: c}
  placement: {clusterAffinity: {clusterNames: [tech-neo-wkld]}}
