# karmada-apiserver에 Gateway API v1.6.1 standard CRD + safe-upgrades VAP + Envoy Gateway CRD — 직접 경로 apps/gateway-crds.yaml과 같은 chart · 같은 values 파일(버전 핀 한 곳).
# template 저장용이라 멤버 전파 없음(멤버 CRD는 직접 경로 몫). telox app root 밖(부트스트랩) — CRD 변경은 CR 커밋보다 먼저.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: karmada-apiserver-crds-gateway
  namespace: argocd
  annotations: {argocd.argoproj.io/compare-options: ServerSideDiff=true}
spec:
  project: karmada-test
  destination: {name: tech-neo-karmada, namespace: karmada-system}
  sources:
  - repoURL: docker.io/envoyproxy
    chart: gateway-crds-helm
    targetRevision: v1.9.2
    helm:
      releaseName: gateway-crds
      valueFiles: [$values/platform/values/gateway-crds.yaml]
  - repoURL: https://github.com/enginrect/gpu-workload-deploy.git
    targetRevision: karmada-argocd-test   # main 머지 때 main
    ref: values
  syncPolicy:
    automated: {selfHeal: true, prune: true}
    syncOptions: [ServerSideApply=true]
    retry: {limit: 5, backoff: {duration: 10s, factor: 2, maxDuration: 3m}}
