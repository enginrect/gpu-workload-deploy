# hub 1회 적용(bootstrap 층) — karmada-apiserver에 Cilium LB IP pool CRD. kubectl --kubeconfig <mgmt> apply -f 이 파일
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: karmada-apiserver-crds-cilium
  namespace: argocd
spec:
  project: karmada-test
  destination:
    name: tech-neo-karmada
  source:
    repoURL: https://github.com/enginrect/gpu-workload-deploy.git
    targetRevision: karmada-argocd-test
    path: karmada/bootstrap/crds/cilium
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
    - ServerSideApply=true
    retry:
      limit: 5
      backoff: {duration: 10s, factor: 2, maxDuration: 3m}
