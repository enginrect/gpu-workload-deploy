# Placement §3 validate — 고객 group이 만드는 Secret은 dockerconfigjson만, label telox.io/project ∈ identity project 목록 · 불변
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata: {name: telox-domain-secret}
spec:
  validationActions: [Deny]
  evaluation:
    background: {enabled: false}
  matchConstraints:
    namespaceSelector:
      matchExpressions: [{key: telox.io/domain, operator: Exists}]
    resourceRules:
    - apiGroups: [""]
      apiVersions: [v1]
      operations: [CREATE, UPDATE]
      resources: [secrets]
  matchConditions:
  - name: customer-group
    expression: "request.userInfo.groups.exists(g, g.startsWith('domain-'))"
  variables:
  - name: project
    expression: "has(object.metadata.labels) && 'telox.io/project' in object.metadata.labels ? object.metadata.labels['telox.io/project'] : ''"
  - name: identityProjects
    expression: "has(request.userInfo.extra) && 'telox.io/projects' in request.userInfo.extra ? request.userInfo.extra['telox.io/projects'] : []"
  validations:
  - expression: "object.type == 'kubernetes.io/dockerconfigjson'"
    message: "customer may only create kubernetes.io/dockerconfigjson secrets"
  - expression: "variables.project != '' && variables.project in variables.identityProjects"
    message: "secret needs label telox.io/project within the identity extra telox.io/projects"
  - expression: "request.operation == 'CREATE' || (has(oldObject.metadata.labels) && 'telox.io/project' in oldObject.metadata.labels && oldObject.metadata.labels['telox.io/project'] == variables.project)"
    message: "label telox.io/project is immutable"
