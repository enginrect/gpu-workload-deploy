# telox Kyverno 정책(ValidatingPolicy 7 · ClusterPolicy 1)을 모든 wkld 멤버에 전파.
# 멤버에 Kyverno CRD(policies.kyverno.io · kyverno.io)가 생길 때까지 karmada-scheduler가 그 멤버를 제외(apiEnablements) → Kyverno chart(직접 배포)보다 먼저 적용해도 됨.
# Overwrite — 직접 배포 경로에서 옮길 때 기존 정책 채택.
apiVersion: policy.karmada.io/v1alpha1
kind: ClusterPropagationPolicy
metadata: {name: telox-kyverno-policies}
spec:
  conflictResolution: Overwrite
  resourceSelectors:
  - {apiVersion: policies.kyverno.io/v1, kind: ValidatingPolicy}
  - {apiVersion: kyverno.io/v1, kind: ClusterPolicy}
  placement:
    clusterAffinity:
      labelSelector: {matchLabels: {telox.io/role: wkld}}
