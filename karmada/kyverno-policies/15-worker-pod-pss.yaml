# Resource §4 — PSS restricted를 Kyverno가 적용, 컨테이너 root · runtime 기본 capability만 제외 (PSA namespace label은 baseline)
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata: {name: telox-domain-pod-pss}
spec:
  validationFailureAction: Enforce
  background: false
  rules:
  - name: restricted-minus-nonroot-caps
    match:
      any:
      - resources:
          kinds: [Pod]
          namespaceSelector:
            matchExpressions: [{key: telox.io/domain, operator: Exists}]
    validate:
      podSecurity:
        level: restricted
        version: latest
        exclude:
        - controlName: "Running as Non-root"
          images: ["*"]
        - controlName: "Running as Non-root user"
          images: ["*"]
        - controlName: "Capabilities"
          images: ["*"]
