# wave 0 — Kyverno CRD 2종(ClusterPolicy · ValidatingPolicy)을 karmada-apiserver에만 설치(template 저장용, 멤버 전파 없음 — 멤버 CRD는 Kyverno chart 몫)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: karmada-kyverno-crds
  namespace: argocd
  annotations: {argocd.argoproj.io/compare-options: ServerSideDiff=true, argocd.argoproj.io/sync-wave: "0"}
spec:
  project: karmada-test
  destination: {name: tech-neo-karmada}
  source: {repoURL: https://github.com/enginrect/gpu-workload-deploy.git, targetRevision: karmada-argocd-test, path: karmada/kyverno-crds}
  syncPolicy:
    automated: {selfHeal: true, prune: true}
    syncOptions: [ServerSideApply=true]
    retry: {limit: 5, backoff: {duration: 10s, factor: 2, maxDuration: 3m}}
