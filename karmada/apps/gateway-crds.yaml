# wave 0 — Gateway API v1.6.1 standard 5종(Gateway · HTTPRoute · TCPRoute · ListenerSet · ReferenceGrant) + Envoy Gateway EnvoyProxy CRD를 karmada-apiserver에만 설치(template 저장용, 멤버 전파 없음 — 멤버 CRD는 직접 경로 gateway-crds 몫). gateway-crds-helm v1.9.2 렌더에서 추출
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: karmada-gateway-crds
  namespace: argocd
  annotations: {argocd.argoproj.io/compare-options: ServerSideDiff=true, argocd.argoproj.io/sync-wave: "0"}
spec:
  project: karmada-test
  destination: {name: tech-neo-karmada}
  source: {repoURL: https://github.com/enginrect/gpu-workload-deploy.git, targetRevision: karmada-argocd-test, path: karmada/gateway-crds}
  syncPolicy:
    automated: {selfHeal: true, prune: true}
    syncOptions: [ServerSideApply=true]
    retry: {limit: 5, backoff: {duration: 10s, factor: 2, maxDuration: 3m}}
