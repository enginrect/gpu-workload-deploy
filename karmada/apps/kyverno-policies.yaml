# wave 2 — telox Kyverno 정책 8개 → 모든 wkld 멤버(멤버에 Kyverno CRD가 생긴 뒤 scheduler가 배치)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: karmada-kyverno-policies
  namespace: argocd
  annotations: {argocd.argoproj.io/compare-options: ServerSideDiff=true, argocd.argoproj.io/sync-wave: "2"}
spec:
  project: karmada-test
  destination: {name: tech-neo-karmada}
  source: {repoURL: https://github.com/enginrect/gpu-workload-deploy.git, targetRevision: karmada-argocd-test, path: karmada/kyverno-policies}
  syncPolicy:
    automated: {selfHeal: true, prune: true}
    syncOptions: [ServerSideApply=true]
    retry: {limit: 5, backoff: {duration: 10s, factor: 2, maxDuration: 3m}}
