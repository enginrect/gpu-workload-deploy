# telox CRD 4종을 label telox.io/role=wkld인 모든 멤버(모든 region)에 전파.
# conflictResolution Overwrite — 직접 배포 경로에서 Karmada 경로로 옮길 때 멤버에 이미 있는 CRD를 채택(기본 Abort는 관리하지 않음).
# preserveResourcesOnDeletion — template(CRD)을 지워도 멤버 CRD는 남김(CRD 삭제 = 그 kind의 CR 전부 삭제). Argo CD도 CRD는 prune하지 않음.
apiVersion: policy.karmada.io/v1alpha1
kind: ClusterPropagationPolicy
metadata: {name: telox-crds}
spec:
  conflictResolution: Overwrite
  preserveResourcesOnDeletion: true
  resourceSelectors:
  - {apiVersion: apiextensions.k8s.io/v1, kind: CustomResourceDefinition, name: domains.telox.io}
  - {apiVersion: apiextensions.k8s.io/v1, kind: CustomResourceDefinition, name: skus.telox.io}
  - {apiVersion: apiextensions.k8s.io/v1, kind: CustomResourceDefinition, name: instances.telox.io}
  - {apiVersion: apiextensions.k8s.io/v1, kind: CustomResourceDefinition, name: serverlessinstances.telox.io}
  placement:
    clusterAffinity:
      labelSelector: {matchLabels: {telox.io/role: wkld}}
