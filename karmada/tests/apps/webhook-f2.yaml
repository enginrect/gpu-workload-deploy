apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: karmada-webhook-f2
  namespace: argocd
  annotations: {argocd.argoproj.io/compare-options: ServerSideDiff=true}
spec:
  project: karmada-test
  destination: {name: tech-neo-karmada}
  source: {repoURL: https://github.com/enginrect/gpu-workload-deploy.git, targetRevision: main, path: karmada/tests/webhook-f2}
  syncPolicy:
    automated: {selfHeal: true, prune: true}
    syncOptions: [ServerSideApply=true]

