apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: karmada-hook-b
  namespace: argocd
  annotations: {argocd.argoproj.io/compare-options: ServerSideDiff=true}
spec:
  project: karmada-test
  destination: {name: tech-neo-karmada, namespace: karmada-hook-b}   # CreateNamespace는 destination.namespace를 만든다
  source: {repoURL: https://github.com/enginrect/gpu-workload-deploy.git, targetRevision: main, path: karmada/tests/hook-b}
  syncPolicy:
    automated: {selfHeal: true, prune: true}
    syncOptions: [ServerSideApply=true, CreateNamespace=true]

