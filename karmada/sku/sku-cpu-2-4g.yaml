# region-2 전용 SKU(pool cpu). placement는 fieldSelector(region) — 그 region의 모든 wkld 클러스터가 대상. telox-sku 정책이 DeviceClass 존재 · pool node 존재를 검사
apiVersion: telox.io/v1alpha1
kind: SKU
metadata: {name: cpu-2-4g}
spec: {pool: cpu, deviceClassName: telox-h100, gpuCount: 0, topology: {numaNodes: 1}, cpu: "2", memory: 4Gi, ephemeralStorage: 10Gi, egressBandwidth: 1G}
---
apiVersion: policy.karmada.io/v1alpha1
kind: ClusterPropagationPolicy
metadata: {name: sku-cpu-2-4g}
spec:
  resourceSelectors: [{apiVersion: telox.io/v1alpha1, kind: SKU, name: cpu-2-4g}]
  placement:
    clusterAffinity:
      labelSelector: {matchLabels: {telox.io/role: wkld}}
      fieldSelector: {matchExpressions: [{key: region, operator: In, values: [region-2]}]}
