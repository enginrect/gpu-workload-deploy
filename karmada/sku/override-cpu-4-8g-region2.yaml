# 클러스터별 차이 — 같은 template(SKU cpu-4-8g)을 region-2 멤버에서만 다른 값으로. targetCluster는 Cluster label로 선택, template · Git은 그대로
apiVersion: policy.karmada.io/v1alpha1
kind: ClusterOverridePolicy
metadata: {name: sku-cpu-4-8g-region2}
spec:
  resourceSelectors: [{apiVersion: telox.io/v1alpha1, kind: SKU, name: cpu-4-8g}]
  overrideRules:
  - targetCluster: {labelSelector: {matchLabels: {telox.io/region: region-2}}}
    overriders:
      plaintext:
      - {path: /spec/egressBandwidth, operator: replace, value: 500M}
