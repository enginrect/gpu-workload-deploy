# cluster당 Gateway 1개 — HTTP 80 · HTTPS 443(*.<cluster address>, wildcard TLS). TCP port는 domain namespace의 ListenerSet(Instance 소유, Karmada 경로)이 붙음
# allowedListeners · allowedRoutes = label telox.io/domain이 있는 namespace(domain namespace)만. 이 Gateway 자체는 ExternalDNS dns-source label 없음
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: telox-instance-gateway
  namespace: telox-system
  labels: {telox.io/component: instance-gateway}
spec:
  gatewayClassName: telox
  infrastructure:
    parametersRef: {group: gateway.envoyproxy.io, kind: EnvoyProxy, name: telox-instance-gateway}
  allowedListeners:
    namespaces:
      from: Selector
      selector: {matchExpressions: [{key: telox.io/domain, operator: Exists}]}
  listeners:
  - name: http
    protocol: HTTP
    port: 80
    hostname: {{ printf "*.%s" .Values.hostname | quote }}
    allowedRoutes:
      namespaces:
        from: Selector
        selector: {matchExpressions: [{key: telox.io/domain, operator: Exists}]}
  - name: https
    protocol: HTTPS
    port: 443
    hostname: {{ printf "*.%s" .Values.hostname | quote }}
    tls: {mode: Terminate, certificateRefs: [{group: "", kind: Secret, name: {{ .Values.tlsSecret }}}]}
    allowedRoutes:
      namespaces:
        from: Selector
        selector: {matchExpressions: [{key: telox.io/domain, operator: Exists}]}
