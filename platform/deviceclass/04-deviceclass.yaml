# Resource §3 — SKU의 GPU 종류. full GPU(type gpu)만
apiVersion: resource.k8s.io/v1
kind: DeviceClass
metadata: {name: neocloud-h100}
spec:
  selectors:
  - cel:
      expression: >-
        device.driver == "gpu.nvidia.com" &&
        device.attributes["gpu.nvidia.com"].type == "gpu" &&
        device.attributes["gpu.nvidia.com"].productName.contains("H100")
