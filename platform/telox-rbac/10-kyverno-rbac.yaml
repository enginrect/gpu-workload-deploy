# Kyverno 컨트롤러가 정책에서 읽는 리소스 — aggregated ClusterRole (admission · reports · background). generate 없음 — namespace 안 오브젝트는 Domain reconcile(telox-instance-worker)
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kyverno:telox-read
  labels:
    rbac.kyverno.io/aggregate-to-admission-controller: "true"
    rbac.kyverno.io/aggregate-to-reports-controller: "true"
    rbac.kyverno.io/aggregate-to-background-controller: "true"
rules:
- apiGroups: [telox.io]
  resources: [instances, serverlessinstances, skus, domains]
  verbs: [get, list, watch]
- apiGroups: [resource.k8s.io]
  resources: [resourceclaims, deviceclasses, resourceslices]
  verbs: [get, list, watch]
- apiGroups: [""]
  resources: [secrets, nodes, namespaces, pods]
  verbs: [get, list, watch]
