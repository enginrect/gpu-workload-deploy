# Network §2 — Instance Pod 클러스터 안 egress 차단(cluster · host · apiserver · 링크로컬 · 사내 10.7/16), world만 허용
# LB IP pool은 domain 단위 — Domain CR spec.lbPool에서 telox-instance-worker가 CiliumLoadBalancerIPPool 생성 (20-domains.yaml)
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata: {name: instance-egress}
spec:
  endpointSelector:
    matchExpressions:
    - {key: telox.io/instance, operator: Exists}
  egressDeny:
  - toEntities: [cluster, host, remote-node, kube-apiserver]
  - toCIDR: ["169.254.0.0/16", "10.7.0.0/16"]
  egress:
  - toEntities: [world]
---
# L2 announcement(테스트 클러스터용). Cilium 문서상 L2는 externalTrafficPolicy Local을 지원하지 않으므로 광고 후보를 pool node로 제한 — cp node가 lease를 잡아 Pod 없는 곳에서 IP를 광고하는 일을 막음. 운영은 BGP Control Plane
apiVersion: cilium.io/v2alpha1
kind: CiliumL2AnnouncementPolicy
metadata: {name: default-l2-policy}
spec:
  externalIPs: false
  loadBalancerIPs: true
  nodeSelector:
    matchLabels: {node-restriction.kubernetes.io/pool: gpu}
