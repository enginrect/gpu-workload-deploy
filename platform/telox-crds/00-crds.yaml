apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: instances.telox.io
spec:
  group: telox.io
  scope: Namespaced
  names: {kind: Instance, plural: instances, singular: instance, shortNames: [inst]}
  versions:
  - name: v1alpha1
    served: true
    storage: true
    subresources: {status: {}}
    additionalPrinterColumns:
    - {name: SKU,   type: string, jsonPath: .spec.sku}
    - {name: Phase, type: string, jsonPath: .status.phase}
    - {name: Node,  type: string, jsonPath: .status.nodeName}
    schema:
      openAPIV3Schema:
        type: object
        required: [spec]
        properties:
          spec:
            type: object
            required: [sku, image]
            x-kubernetes-validations:
            - rule: "self.sku == oldSelf.sku"
              message: "sku is immutable"
            - rule: "self.spot == oldSelf.spot"
              message: "spot is immutable"
            - rule: "!has(oldSelf.storage) || (has(self.storage) && quantity(self.storage.size).compareTo(quantity(oldSelf.storage.size)) >= 0)"
              message: "storage can only grow and cannot be removed"
            - rule: "self.restart >= oldSelf.restart"
              message: "restart is monotonic"
            properties:
              sku:             {type: string, pattern: '^[a-z0-9-]+$'}
              image:           {type: string}
              imagePullSecret: {type: string}
              command:         {type: array, items: {type: string}}
              env:
                type: array
                items:
                  type: object
                  required: [name, value]
                  properties: {name: {type: string}, value: {type: string}}
              storage:
                type: object
                properties:
                  size: {type: string, pattern: '^[0-9]+Gi$'}
              ports:
                type: array
                maxItems: 8
                items:
                  type: object
                  required: [name, port]
                  properties:
                    name:     {type: string}
                    port:     {type: integer, minimum: 1, maximum: 65535}
                    protocol: {type: string, enum: [TCP, UDP], default: TCP}
              sshPublicKey: {type: string}
              authorizedKeys:   # 기본 SSH — 이 Instance에 접속할 수 있는 OpenSSH 공개키. IAM(telox-manager)이 기록, Instance와 같이 그 클러스터에만 전파. telox-worker는 이 필드 변경에 Pod를 재생성하지 않음
                type: array
                maxItems: 32
                items: {type: string, pattern: '^(ssh-ed25519|ssh-rsa|ecdsa-sha2-nistp(256|384|521)|sk-ssh-ed25519@openssh\.com|sk-ecdsa-sha2-nistp256@openssh\.com) [A-Za-z0-9+/]+=*( [^\n]*)?$'}
              spot:         {type: boolean, default: false}
              stopped:      {type: boolean, default: false}
              restart:      {type: integer, default: 0, minimum: 0}
          status:
            type: object
            properties:
              phase:           {type: string, enum: [Pending, Starting, Running, Stopping, Stopped, Preempted, Failed]}
              podName:         {type: string}
              nodeName:        {type: string}
              gpus:            {type: array, items: {type: string}}
              endpoint:        {type: string}
              imageDigest:     {type: string}
              observedRestart: {type: integer}
              conditions:
                type: array
                items:
                  type: object
                  properties:
                    type:               {type: string}
                    status:             {type: string}
                    reason:             {type: string}
                    message:            {type: string}
                    lastTransitionTime: {type: string}
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata: {name: skus.telox.io}
spec:
  group: telox.io
  scope: Cluster
  names: {kind: SKU, plural: skus, singular: sku}
  versions:
  - name: v1alpha1
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        type: object
        required: [spec]
        x-kubernetes-validations:
        - rule: "self.spec == oldSelf.spec"
          message: "SKU spec is immutable; publish a new name"
        properties:
          spec:
            type: object
            required: [pool, deviceClassName, gpuCount, topology, cpu, memory, ephemeralStorage, egressBandwidth]
            x-kubernetes-validations:
            - rule: "self.gpuCount <= 4 ? self.topology.numaNodes == 1 : self.topology.numaNodes == 2"
              message: "numaNodes is 1 for 1-4 GPUs, 2 for 8 GPUs"
            properties:
              pool:             {type: string, enum: [gpu, serverless]}   # serverless = ServerlessInstance worker 전용 pool(Instance와 node 분리)
              deviceClassName:  {type: string, pattern: '^telox-'}
              gpuCount:         {type: integer, enum: [0, 1, 2, 4, 8]}   # 0 = CPU Instance (테스트용, 설계 enum은 1·2·4·8)
              topology:
                type: object
                required: [numaNodes]
                properties:
                  numaNodes:    {type: integer, enum: [1, 2]}
              cpu:              {type: string, pattern: '^[0-9]+$'}
              memory:           {type: string, pattern: '^[0-9]+(Gi|Mi)$'}
              ephemeralStorage: {type: string, pattern: '^[0-9]+(Gi|Mi)$'}
              egressBandwidth:  {type: string, pattern: '^[0-9]+[MG]$'}
---
# Domain CRD — 계약 · 과금 단위. 클러스터 스코프, domain마다 하나 — domain이 걸치는 클러스터마다 Karmada가 전파(클러스터별 allowedSkus · maxGpus · lbPool은 ClusterOverridePolicy). telox-manager 운영 identity가 생성, telox-worker가 Namespace · RoleBinding · ResourceQuota · default-deny · LB pool로 reconcile
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata: {name: domains.telox.io}
spec:
  group: telox.io
  scope: Cluster
  names: {kind: Domain, plural: domains, singular: domain, shortNames: [dom]}
  versions:
  - name: v1alpha1
    served: true
    storage: true
    subresources: {status: {}}
    additionalPrinterColumns:
    - {name: Namespace, type: string,  jsonPath: .status.namespace}
    - {name: Instances, type: integer, jsonPath: .status.usage.instances}
    - {name: Storage,   type: string,  jsonPath: .status.usage.storage}
    - {name: Ready,     type: string,  jsonPath: '.status.conditions[?(@.type=="Ready")].status'}
    schema:
      openAPIV3Schema:
        type: object
        required: [spec]
        x-kubernetes-validations:
        - rule: "size(self.metadata.name) <= 56"
          message: "domain id is at most 56 characters (namespace domain-<id> must fit 63)"
        properties:
          spec:
            type: object
            required: [allowedSkus, maxGpus, maxStorage, lbPool]
            properties:
              allowedSkus:
                type: array
                items: {type: string, pattern: '^[a-z0-9-]+$'}
              maxGpus:
                type: object
                additionalProperties: {type: integer, minimum: 0}
              maxStorage:     {type: string, pattern: '^[0-9]+(Gi|Ti)$'}
              maxInstances:   {type: integer, minimum: 0, default: 32}
              lbPool:
                type: object
                required: [cidrs]
                properties:
                  cidrs:
                    type: array
                    minItems: 1
                    items: {type: string, pattern: '^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+/[0-9]+$'}
              serverless:                            # serverless 계약. 없거나 maxWorkers 0 = serverless 없음
                type: object
                properties:
                  maxWorkers: {type: integer, minimum: 0, default: 0}   # domain namespace의 ServerlessInstance maxWorkers 합 상한(Kyverno). ResourceQuota pods = maxInstances + 이 값
          status:
            type: object
            properties:
              namespace:          {type: string}
              observedGeneration: {type: integer}
              usage:
                type: object
                properties:
                  instances: {type: integer}
                  gpus:
                    type: object
                    additionalProperties: {type: integer}
                  storage:   {type: string}
                  serverlessInstances: {type: integer}
                  serverlessWorkers:   {type: integer}   # ServerlessInstance spec.workers 합(desired)
              conditions:
                type: array
                items:
                  type: object
                  properties:
                    type:               {type: string}
                    status:             {type: string}
                    reason:             {type: string}
                    message:            {type: string}
                    lastTransitionTime: {type: string}
