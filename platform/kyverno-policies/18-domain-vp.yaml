# Placement §3 validate — Domain 오브젝트(telox-manager 운영 identity의 상한): 허용 SKU 존재 · maxGpus pool이 node pool 집합 안 · LB 대역이 다른 Domain과 겹치지 않음
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata: {name: telox-domain}
spec:
  validationActions: [Deny]
  evaluation:
    background: {enabled: false}
  matchConstraints:
    resourceRules:
    - apiGroups: [telox.io]
      apiVersions: [v1alpha1]
      operations: [CREATE, UPDATE]
      resources: [domains]
  variables:
  - name: skuNames
    expression: "dyn(resource.List('telox.io/v1alpha1', 'skus', '')).items.map(s, s.metadata.name)"
  - name: pools
    expression: "dyn(resource.List('v1', 'nodes', '')).items.filter(n, 'node-restriction.kubernetes.io/pool' in n.metadata.labels).map(n, n.metadata.labels['node-restriction.kubernetes.io/pool'])"
  - name: otherCidrs
    expression: "dyn(resource.List('telox.io/v1alpha1', 'domains', '')).items.filter(d, d.metadata.name != object.metadata.name).map(d, d.spec.lbPool.cidrs).flatten()"
  validations:
  - expression: "object.spec.allowedSkus.all(s, s in variables.skuNames)"
    messageExpression: "'allowedSkus contains unknown SKU: ' + object.spec.allowedSkus.filter(s, !(s in variables.skuNames)).join(',')"
  - expression: "object.spec.maxGpus.all(p, p in variables.pools)"
    messageExpression: "'maxGpus pool has no node with label node-restriction.kubernetes.io/pool: ' + object.spec.maxGpus.filter(p, !(p in variables.pools)).join(',')"
  - expression: "object.spec.lbPool.cidrs.all(c, !variables.otherCidrs.exists(o, cidr(o).containsCIDR(cidr(c)) || cidr(c).containsCIDR(cidr(o))))"
    message: "lbPool.cidrs overlaps another Domain's lbPool"
