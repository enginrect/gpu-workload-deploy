{{- if .Values.pool.cidr }}
# platform gateway LB 대역(SSH gateway · instance gateway). domain lbPool과 겹치지 않게
apiVersion: cilium.io/v2
kind: CiliumLoadBalancerIPPool
metadata:
  name: {{ .Values.pool.name }}
spec:
  blocks:
  - cidr: {{ .Values.pool.cidr }}
  serviceSelector:
    matchExpressions: [{key: telox.io/component, operator: In, values: [ssh-gateway, instance-gateway]}]
{{- end }}
