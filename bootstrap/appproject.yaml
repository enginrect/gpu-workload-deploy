# mgmt(tech-neo-mgmt) argocd ns에 손으로 apply — applicationset.yaml과 같이.
# 자식 Application 전부가 속하는 프로젝트. 대상은 wkld cluster들(Argo CD cluster Secret 이름 — cluster 등록 · 퇴역 때 여기도 갱신), 모든 ns · cluster-scoped 리소스 허용.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: telox-platform
  namespace: argocd
spec:
  description: telox wkld platform components
  sourceRepos:
  - https://github.com/enginrect/gpu-workload-deploy.git
  - https://kyverno.github.io/kyverno
  - https://containers.github.io/nri-plugins
  - https://helm.ngc.nvidia.com/nvidia
  - docker.io/envoyproxy
  - https://kubernetes-sigs.github.io/external-dns/
  destinations:
  - name: tech-neo-wkld-region2
    namespace: '*'
  clusterResourceWhitelist:
  - group: '*'
    kind: '*'
  namespaceResourceWhitelist:
  - group: '*'
    kind: '*'
