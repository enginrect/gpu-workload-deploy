# hub(tech-neo-mgmt) argocd ns에 손으로 apply — root-app.yaml과 같이.
# 자식 Application 전부가 속하는 프로젝트. 대상은 tech-neo-wkld 하나, 모든 ns · cluster-scoped 리소스 허용.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: neocloud-platform
  namespace: argocd
spec:
  description: tech-neo-wkld platform components (GitOps adoption of helm/kubectl installs)
  sourceRepos:
  - https://github.com/enginrect/gpu-workload-deploy.git
  - https://kyverno.github.io/kyverno
  - https://containers.github.io/nri-plugins
  - https://helm.ngc.nvidia.com/nvidia
  - https://github.com/kubernetes-sigs/dra-driver-nvidia-gpu
  - docker.io/envoyproxy
  - https://kubernetes-sigs.github.io/external-dns/
  destinations:
  - name: tech-neo-wkld
    namespace: '*'
  clusterResourceWhitelist:
  - group: '*'
    kind: '*'
  namespaceResourceWhitelist:
  - group: '*'
    kind: '*'
